server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: ecommerce-whitelabel-java
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whitelabel_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:ChaveSecretaSuperSeguraParaAssinaturaJWTComMinimo256Bits2026}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  providers:
    brazilian-url: ${BRAZILIAN_PROVIDER_URL:http://616d6bdb6dacbb001794ca17.mockapi.io/devnology/brazilian_provider}
    european-url: ${EUROPEAN_PROVIDER_URL:http://616d6bdb6dacbb001794ca17.mockapi.io/devnology/european_provider}

springdoc:
  swagger-ui:
    path: /api